[tox]
envlist = py312,py313,py314

[testenv]
skip_install = true
allowlist_externals = uv
setenv =
    UV_PROJECT_ENVIRONMENT = {envdir}
commands =
    uv sync --locked --python {envpython}
    uv run --locked --no-sync ruff check .
    uv run --locked --no-sync ruff format --check .
    uv run --locked --no-sync pyrefly check
    uv run --locked --no-sync pytest --junitxml=pytest-{envname}.xml tests/
    uv run --locked --no-sync bandit -r src --skip B101
